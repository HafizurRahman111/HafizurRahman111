name: Repo count

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count repositories
        env:
          GH_TOKEN: ${{ secrets.REPO_COUNT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "REPO_COUNT_TOKEN secret is not set" >&2
            exit 1
          fi
          user=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/user)
          public=$(echo "$user" | jq '.public_repos')
          private=$(echo "$user" | jq '.total_private_repos // 0')
          total=$((public + private))
          mkdir -p stats
          printf '{"schemaVersion":1,"label":"Total repos","message":"%s","color":"8250df"}\n' "$total" > stats/total-repos.json
          printf '{"schemaVersion":1,"label":"Public repos","message":"%s","color":"0969da"}\n' "$public" > stats/public-repos.json
          cat stats/*.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || git commit -m "Update repo count"
          git push
